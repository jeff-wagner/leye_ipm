<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 782" width="1060" height="782"
     font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8628F"/>
    </marker>
  </defs>

  <rect width="1060" height="782" fill="#ffffff"/>

  <!-- ===================== submodel boxes ===================== -->
  <!-- state-space / count model: tall centre column, drawn first so the flanking
       boxes overlap it and the shared parameters sit inside the overlaps -->
  <rect x="300" y="28" width="440" height="628" rx="4" fill="#8a8a8a" fill-opacity="0.10"
        stroke="#4a4a4a" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="520" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3742">Count data:</text>
  <text x="520" y="72" text-anchor="middle" font-size="14" font-style="italic" fill="#2d3742">state-space model</text>

  <rect x="46" y="96" width="374" height="304" rx="4" fill="#009E73" fill-opacity="0.10"
        stroke="#4a4a4a" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="60" y="122" font-size="15" font-weight="600" fill="#2d3742">Productivity data:</text>
  <text x="60" y="141" font-size="14" font-style="italic" fill="#2d3742">nest success × brood size</text>

  <rect x="620" y="96" width="394" height="304" rx="4" fill="#D55E00" fill-opacity="0.10"
        stroke="#4a4a4a" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="1000" y="122" text-anchor="end" font-size="15" font-weight="600" fill="#2d3742">Capture–recapture data:</text>
  <text x="1000" y="141" text-anchor="end" font-size="14" font-style="italic" fill="#2d3742">CJS with sex and tag covariates</text>

  <!-- 1990s cohorts enter as an informative prior, not as a likelihood here -->
  <rect x="46" y="466" width="248" height="150" rx="4" fill="#B8628F" fill-opacity="0.10"
        stroke="#B8628F" stroke-width="1.4" stroke-dasharray="3 4"/>
  <text x="60" y="492" font-size="15" font-weight="600" fill="#2d3742">Chick cohorts, two eras:</text>
  <text x="60" y="511" font-size="14" font-style="italic" fill="#2d3742">external analysis; the IPM</text>
  <text x="60" y="529" font-size="14" font-style="italic" fill="#2d3742">prior is the modern estimate</text>
  <text x="60" y="554" font-size="12.5" fill="#5a6570">133 chicks banded 2018–25 and</text>
  <text x="60" y="570" font-size="12.5" fill="#5a6570">139 in 1995–98, fitted jointly</text>
  <text x="60" y="586" font-size="12.5" fill="#5a6570">with 178 1990s adults, which</text>
  <text x="60" y="602" font-size="12.5" fill="#5a6570">pin the shared detection</text>

  <!-- ===================== arrows ===================== -->
  <g stroke="#3a3a3a" stroke-width="1.7" fill="none" marker-end="url(#a)">
    <path d="M 130 241 L 163 312"/>
    <path d="M 204 282 L 190 312"/>
    <path d="M 143 223 L 331 236"/>
    <path d="M 238 259 L 331 256"/>
    <path d="M 365 265 L 497 462"/>
    <path d="M 655 265 L 526 462"/>
    <path d="M 689 256 L 780 301"/>
    <path d="M 812 197 L 812 296"/>
    <path d="M 898 246 L 691 246"/>
    <path d="M 902 233 L 831 187"/>
    <path d="M 409 417 L 490 470"/>
    <path d="M 469 423 L 497 463"/>
    <path d="M 590 419 L 532 467"/>
    <path d="M 512 510 L 512 566"/>
    <path d="M 587 506 L 541 570"/>
  </g>

  <!-- prior -> recruitment, styled to match the life-cycle figure -->
  <g stroke="#B8628F" stroke-width="2" fill="none" stroke-dasharray="8 4" marker-end="url(#ap)">
    <path d="M 294 508 C 336 496, 356 460, 378 429"/>
    <path d="M 294 528 C 384 528, 424 470, 446 429"/>
  </g>

  <!-- two-year recruitment lag: self-reference on N -->
  <path d="M 486 472 C 424 458, 424 512, 486 498" fill="none" stroke="#3a3a3a"
        stroke-width="1.7" marker-end="url(#a)"/>
  <text x="416" y="479" text-anchor="end" font-size="12.5" fill="#5a6570">N</text>
  <text x="418" y="483" font-size="9.5" fill="#5a6570">t−1</text>
  <text x="416" y="500" text-anchor="end" font-size="12.5" fill="#5a6570">N</text>
  <text x="418" y="504" font-size="9.5" fill="#5a6570">t−2</text>

  <!-- ===================== parameter nodes ===================== -->
  <g fill="#fdf2f0" stroke="#C0392B" stroke-width="2">
    <circle cx="120" cy="220" r="23"/>
    <circle cx="215" cy="262" r="23"/>
    <circle cx="352" cy="246" r="23"/>
    <circle cx="668" cy="246" r="23"/>
    <circle cx="812" cy="174" r="23"/>
    <circle cx="922" cy="246" r="24"/>
    <circle cx="390" cy="404" r="23"/>
    <circle cx="456" cy="404" r="23"/>
    <circle cx="608" cy="404" r="23"/>
    <circle cx="512" cy="484" r="26"/>
    <circle cx="602" cy="490" r="22"/>
  </g>
  <g font-size="18" font-weight="700" fill="#8B2B22" text-anchor="middle">
    <text x="120" y="227">s</text>
    <text x="215" y="269">q</text>
    <text x="352" y="253">f</text>
    <text x="666" y="253">φ</text>
    <text x="812" y="181">p</text>
    <text x="922" y="253" font-size="17">β</text>
    <text x="387" y="411">ψ</text>
    <text x="453" y="411">ψ</text>
    <text x="608" y="411">ω</text>
    <text x="509" y="491">N</text>
    <text x="598" y="497" font-size="16">θ</text>
  </g>
  <g font-size="10.5" fill="#8B2B22">
    <text x="397" y="415">1</text>
    <text x="463" y="415">2</text>
    <text x="676" y="257">ad</text>
    <text x="518" y="495">t</text>
    <text x="607" y="501">obs</text>
  </g>
  <text x="922" y="292" text-anchor="middle" font-size="12" fill="#5a6570">sex, tag type</text>

  <!-- ===================== data nodes ===================== -->
  <g fill="#edf2fa" stroke="#1F4E9C" stroke-width="2.2">
    <rect x="149" y="314" width="52" height="42" rx="3"/>
    <rect x="786" y="298" width="52" height="42" rx="3"/>
    <rect x="486" y="568" width="52" height="42" rx="3"/>
  </g>
  <g font-size="19" font-weight="700" fill="#16386F" text-anchor="middle">
    <text x="175" y="342">J</text>
    <text x="812" y="326">m</text>
    <text x="512" y="596">C</text>
  </g>
  <g font-size="12" fill="#5a6570" text-anchor="middle">
    <text x="175" y="374">chicks per nest</text>
    <text x="175" y="389">77 nests</text>
    <text x="812" y="358">encounter histories</text>
    <text x="812" y="373">213 adults</text>
    <text x="512" y="628">wetland counts</text>
    <text x="512" y="643">855 records</text>
  </g>

  <!-- ===================== key ===================== -->
  <line x1="46" y1="676" x2="1014" y2="676" stroke="#d3d9de" stroke-width="1"/>
  <circle cx="62" cy="706" r="13" fill="#fdf2f0" stroke="#C0392B" stroke-width="2"/>
  <text x="84" y="711" font-size="13.5" fill="#2d3742">estimated quantity (parameter or latent state)</text>
  <rect x="446" y="694" width="26" height="24" rx="3" fill="#edf2fa" stroke="#1F4E9C" stroke-width="2.2"/>
  <text x="484" y="711" font-size="13.5" fill="#2d3742">observed data</text>
  <text x="640" y="711" font-size="13.5" fill="#2d3742">Parameters in an overlap are informed by both adjoining data sets.</text>

  <text x="46" y="742" font-size="12.5" fill="#5a6570">f = s × 4 × q, the mean number of chicks per nest.</text>
  <text x="46" y="763" font-size="12.5" fill="#5a6570">θ</text>
  <text x="54" y="767" font-size="9.5" fill="#5a6570">obs</text>
  <text x="72" y="763" font-size="12.5" fill="#5a6570">collects the count-model scaling, week, effort, site and overdispersion terms.</text>

</svg>
